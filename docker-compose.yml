services:
  library-management-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app-library-management
    ports:
      - "7015:7015"
    environment:
      - ASPNETCORE_URLS=https://+:7015
      - ASPNETCORE_ENVIRONMENT=Docker
    networks:
      - app_network
    depends_on:
      - db
  db:
    image: postgres:15-alpine
    container_name: db-library-management
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    networks:
      - app_network
volumes:
  postgres_data:
networks:
  app_network:
    driver: bridge
